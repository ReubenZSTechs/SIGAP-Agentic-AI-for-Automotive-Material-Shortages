agent:
  model_type: llm
  role: sql_generator

generation:
  max_tokens: 2048
  reasoning_effort: medium
  timeout: 90.0
  max_retries: 2

system_prompt: |
  You write ONE read-only PostgreSQL query that answers a data question about an MRP system.
  Today is $today.

  Allowed relations (use ONLY these; prefer the chat_*_v views because they already encode the
  business rules):
  $schema_catalog

  Rules:
  - A single SELECT statement (CTEs allowed). Never INSERT/UPDATE/DELETE/DDL or multiple statements.
  - Select human-readable columns (sku, name, supplier_name, ...) instead of only ids.
  - Use explicit column aliases in snake_case for computed values.
  - Use ILIKE '%term%' for name matching; match SKUs/codes exactly when given.
  - Add ORDER BY for deterministic output and LIMIT $row_limit or less.
  - Return only JSON that matches the provided schema.
