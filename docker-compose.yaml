name: sigap-mrp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mrp
      POSTGRES_PASSWORD: mrp
      POSTGRES_DB: mrp
      TEST_DB: mrp_test
      CHAT_RO_USER: mrp_chat_ro
      CHAT_RO_PASSWORD: mrp_chat_ro
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrp -d mrp"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://mrp:mrp@db:5432/mrp
      CHAT_DATABASE_URL: postgresql://mrp_chat_ro:mrp_chat_ro@db:5432/mrp
      TEST_DATABASE_URL: postgresql://mrp:mrp@db:5432/mrp_test
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_DEMO: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Agent Telegram supplier: dispatch percakapan, long polling Telegram, pengingat/eskalasi.
  supplier-worker:
    build: ./backend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://mrp:mrp@db:5432/mrp
      CHAT_DATABASE_URL: postgresql://mrp_chat_ro:mrp_chat_ro@db:5432/mrp
      CORS_ORIGINS: http://localhost:8080
    command: ["python", "-m", "app.supplier_chat.worker"]
    restart: unless-stopped

  # Agent Hub (Streamlit, opsional): riwayat setiap panggilan agent LLM. docker compose --profile tools up agent-hub
  agent-hub:
    build: ./backend
    profiles: ["tools"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mrp:mrp@db:5432/mrp
      CORS_ORIGINS: http://localhost:8080
      SIGAP_API_URL: http://backend:8000/api/v1
    command: ["sh", "-c", "pip install -q -r requirements-streamlit.txt && streamlit run streamlit_app/agent_hub.py --server.address 0.0.0.0 --server.port 8501 --server.headless true"]
    ports:
      - "127.0.0.1:8501:8501"          # hanya lokal: isi prompt memuat data bisnis & pesan supplier

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db-data:
